<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 블록 파쿠르</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif}
canvas{display:block}
#ui{position:fixed;left:15px;top:15px;color:white;background:rgba(0,0,0,.55);padding:12px 15px;border-radius:10px;z-index:5;line-height:1.6;text-shadow:1px 1px 2px #000}
#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-size:24px;z-index:4;text-shadow:0 0 4px #000;pointer-events:none}
#start{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:10;color:white;text-align:center}
.panel{background:#202020;padding:30px 40px;border-radius:16px;box-shadow:0 10px 40px #000}
button{font-size:18px;padding:12px 25px;border:0;border-radius:8px;cursor:pointer}
#win{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.75);color:white;align-items:center;justify-content:center;text-align:center}
#msg{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:white;padding:8px 16px;border-radius:8px;z-index:6}
</style>
</head>
<body>

<div id="ui">
  🧱 <b>3D 블록 파쿠르</b><br>
  WASD: 이동 &nbsp; Space: 점프<br>
  마우스: 시점 회전 &nbsp; R: 체크포인트<br>
  <span id="stats">체크포인트: 시작</span>
</div>
<div id="cross">+</div>
<div id="msg">마우스를 클릭하고 파쿠르를 시작하세요!</div>

<div id="start">
  <div class="panel">
    <h1>🧱 3D 블록 파쿠르</h1>
    <p>마인크래프트 느낌의 3D 파쿠르 맵</p>
    <p>WASD 이동 · Space 점프 · 마우스 시점</p>
    <button id="play">게임 시작</button>
  </div>
</div>

<div id="win">
  <div class="panel">
    <h1>🏆 파쿠르 클리어!</h1>
    <p id="final"></p>
    <button onclick="location.reload()">다시 하기</button>
  </div>
</div>

<script>
// 외부 라이브러리 없이 WebGL로 직접 만드는 간단한 3D 블록 파쿠르
const canvas=document.createElement("canvas");
document.body.appendChild(canvas);
const gl=canvas.getContext("webgl");
if(!gl){alert("이 브라우저는 WebGL을 지원하지 않습니다.");throw 0;}

function resize(){
  canvas.width=innerWidth; canvas.height=innerHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener("resize",resize); resize();

const vs=`
attribute vec3 p;
attribute vec3 c;
uniform mat4 mvp;
varying vec3 col;
void main(){gl_Position=mvp*vec4(p,1.0);col=c;}
`;
const fs=`
precision mediump float;
varying vec3 col;
void main(){gl_FragColor=vec4(col,1.0);}
`;
function shader(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog); gl.useProgram(prog);

const locP=gl.getAttribLocation(prog,"p");
const locC=gl.getAttribLocation(prog,"c");
const locM=gl.getUniformLocation(prog,"mvp");

function matMul(a,b){
 let r=new Float32Array(16);
 for(let c=0;c<4;c++)for(let row=0;row<4;row++)
  r[c*4+row]=a[row]*b[c*4]+a[4+row]*b[c*4+1]+a[8+row]*b[c*4+2]+a[12+row]*b[c*4+3];
 return r;
}
function perspective(fovy,aspect,n,f){
 const t=1/Math.tan(fovy/2), nf=1/(n-f);
 return new Float32Array([t/aspect,0,0,0,0,t,0,0,0,0,(f+n)*nf,-1,0,0,2*f*n*nf,0]);
}
function cameraMatrix(x,y,z,yaw,pitch){
 const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 // view = rotation X * rotation Y * translation
 return new Float32Array([
  cy, sy*sp, -sy*cp,0,
  0,cp,sp,0,
  sy,-cy*sp,cy*cp,0,
  -(cy*x+sy*z), -(sy*sp*x+cp*y-cy*sp*z), sy*cp*x-sp*y-cy*cp*z,1
 ]);
}
function cubeData(x,y,z,sx,sy,sz,color){
 const x0=x-sx/2,x1=x+sx/2,y0=y-sy/2,y1=y+sy/2,z0=z-sz/2,z1=z+sz/2;
 const faces=[
  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],
  [[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]],
  [[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]],
  [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],
  [[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]],
  [[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]]
 ];
 const out=[];
 for(let f=0;f<6;f++){
  const cc=color.map(v=>Math.min(1,v*(f===2?1.15:(f===3?.72:.9))));
  const q=faces[f];
  [0,1,2,0,2,3].forEach(i=>{out.push(...q[i],...cc)});
 }
 return out;
}

// 맵: [x,y,z, width,height,depth, color]
const blocks=[];
function add(x,y,z,w=2,h=1,d=2,c=[.25,.65,.25]){blocks.push({x,y,z,w,h,d,c});}
const green=[.25,.65,.25], stone=[.42,.42,.45], gold=[.95,.65,.08], blue=[.12,.45,.9], red=[.8,.15,.12];

// 시작 구간
add(0,0,0,6,1,6,green);
add(5,1,0,3,1,3,stone);
add(9,2,1,2.5,1,2.5,green);
add(13,3,0,3,1,3,blue);

// 점프 구간
add(17,4,0,2,1,2,green);
add(21,5,2,2,1,2,green);
add(25,6,0,2,1,2,stone);
add(29,7,-2,2,1,2,green);
add(33,8,0,3,1,3,gold);

// 체크포인트
add(38,9,0,4,1,4,blue);

// 긴 구간
add(43,10,2,2,1,2,green);
add(47,11,0,2,1,2,green);
add(51,12,-2,2,1,2,green);
add(55,13,0,2,1,2,stone);
add(59,14,2,2,1,2,green);
add(63,15,0,3,1,3,gold);

// 마지막 구간
add(68,16,0,2,1,2,green);
add(72,17,2,2,1,2,green);
add(76,18,0,3,1,3,blue);
add(81,19,0,6,1,6,red); // 골인

const verts=[];
for(const b of blocks) verts.push(...cubeData(b.x,b.y,b.z,b.w,b.h,b.d,b.c));
const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);
gl.enableVertexAttribArray(locP);
gl.vertexAttribPointer(locP,3,gl.FLOAT,false,24,0);
gl.enableVertexAttribArray(locC);
gl.vertexAttribPointer(locC,3,gl.FLOAT,false,24,12);

gl.enable(gl.DEPTH_TEST);
gl.clearColor(.53,.78,.96,1);

// 플레이어
let p={x:0,y:2.2,z:0,vy:0};
let yaw=0,pitch=-.12;
let checkpoint={x:0,y:2.2,z:0};
let grounded=false;
let keys={};
let started=false,won=false;
let deaths=0, startTime=0;

addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(e.code==="KeyR") reset();
 if(e.code==="Space") e.preventDefault();
});
addEventListener("keyup",e=>keys[e.code]=false);

document.getElementById("play").onclick=()=>{
 started=true;
 startTime=performance.now();
 document.getElementById("start").style.display="none";
 canvas.requestPointerLock();
 msg("마우스를 움직여 시점을 조절하세요!");
};
canvas.onclick=()=>{if(started&&!won)canvas.requestPointerLock();};

addEventListener("mousemove",e=>{
 if(document.pointerLockElement===canvas && started){
  yaw-=e.movementX*.0025;
  pitch-=e.movementY*.0025;
  pitch=Math.max(-1.35,Math.min(1.35,pitch));
 }
});

function msg(t){
 document.getElementById("msg").textContent=t;
 setTimeout(()=>{if(document.getElementById("msg").textContent===t)
 document.getElementById("msg").textContent="WASD + Space로 이동";},2200);
}

function reset(){
 p.x=checkpoint.x;p.y=checkpoint.y;p.z=checkpoint.z;p.vy=0;
 deaths++;
 msg("낙사! 체크포인트로 돌아왔습니다.");
}

function update(dt){
 if(!started||won)return;
 const speed=6.5;
 let fx=-Math.sin(yaw),fz=-Math.cos(yaw);
 let rx=Math.cos(yaw),rz=-Math.sin(yaw);
 let dx=0,dz=0;
 if(keys.KeyW){dx+=fx;dz+=fz}
 if(keys.KeyS){dx-=fx;dz-=fz}
 if(keys.KeyD){dx+=rx;dz+=rz}
 if(keys.KeyA){dx-=rx;dz-=rz}
 const len=Math.hypot(dx,dz)||1;
 p.x+=dx/len*speed*dt;
 p.z+=dz/len*speed*dt;

 if(keys.Space&&grounded){p.vy=8.5;grounded=false}
 p.vy-=22*dt;
 const oldY=p.y;
 p.y+=p.vy*dt;

 grounded=false;
 for(const b of blocks){
  const top=b.y+b.h/2;
  const withinX=Math.abs(p.x-b.x)<b.w/2+.28;
  const withinZ=Math.abs(p.z-b.z)<b.d/2+.28;
  if(withinX&&withinZ&&oldY>=top+.05&&p.y<=top+.3&&p.vy<=0){
    p.y=top+.9;p.vy=0;grounded=true;
    if(b.c===blue){
      checkpoint={x:b.x,y:top+.9,z:b.z};
      msg("💾 체크포인트 저장!");
    }
  }
 }
 if(p.y<-8) reset();

 // 골인 블록
 if(p.x>78 && p.x<84 && Math.abs(p.z)<3.5 && p.y>19){
   won=true;
   const sec=((performance.now()-startTime)/1000).toFixed(1);
   document.getElementById("final").textContent=
    `기록: ${sec}초 · 낙사: ${deaths}회`;
   document.getElementById("win").style.display="flex";
   document.exitPointerLock?.();
 }

 document.getElementById("stats").textContent=
  `체크포인트: ${checkpoint.x===0?"시작":"저장됨"} · 낙사: ${deaths}`;
}

function render(){
 gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const proj=perspective(Math.PI/3,canvas.width/canvas.height,.1,300);
 const view=cameraMatrix(p.x,p.y,p.z,yaw,pitch);
 gl.uniformMatrix4fv(locM,false,matMul(proj,view));
 gl.drawArrays(gl.TRIANGLES,0,verts.length/6);
}

let last=performance.now();
function loop(now){
 const dt=Math.min(.033,(now-last)/1000);last=now;
 update(dt);render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
