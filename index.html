```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방 탈출</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    background:
        radial-gradient(circle at 50% 35%, #292929 0%, #111 45%, #050505 100%);
}

/* 어두운 효과 */
#darkness {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 50% 50%,
        transparent 0px,
        rgba(0,0,0,.25) 180px,
        rgba(0,0,0,.75) 500px,
        rgba(0,0,0,.95) 900px);
}

/* 천장등 */
#lamp {
    position: absolute;
    top: 35px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 25px;
    background: #ddd;
    border-radius: 50%;
    box-shadow: 0 0 70px 35px rgba(255,240,180,.25);
}

/* 벽 */
.wall {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 68%;
    background:
        repeating-linear-gradient(
            90deg,
            #242424 0px,
            #242424 100px,
            #202020 101px,
            #202020 103px
        );
}

/* 바닥 */
.floor {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 32%;
    background:
        repeating-linear-gradient(
            90deg,
            #171717 0,
            #171717 120px,
            #222 121px,
            #222 123px
        ),
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 55px,
            rgba(255,255,255,.03) 56px
        );
}

/* 문 */
#door {
    position: absolute;
    width: 190px;
    height: 390px;
    left: 50%;
    bottom: 32%;
    transform: translateX(-50%);
    background: linear-gradient(90deg,#161616,#292929,#151515);
    border: 7px solid #111;
    box-shadow: inset 0 0 30px black, 0 0 30px #000;
    cursor: pointer;
}

#door::before {
    content: "";
    position: absolute;
    inset: 15px;
    border: 2px solid #444;
}

#handle {
    position: absolute;
    right: 25px;
    top: 50%;
    width: 15px;
    height: 55px;
    background: #777;
    border-radius: 8px;
}

#lock {
    position: absolute;
    left: 50%;
    top: 45%;
    transform: translate(-50%,-50%);
    width: 35px;
    height: 35px;
    border: 4px solid #888;
    border-radius: 50%;
}

/* 책상 */
#desk {
    position: absolute;
    left: 8%;
    bottom: 25%;
    width: 260px;
    height: 25px;
    background: #38261b;
    box-shadow: 0 8px 0 #21150e;
}

#desk::before,
#desk::after {
    content: "";
    position: absolute;
    top: 20px;
    width: 20px;
    height: 180px;
    background: #28190f;
}

#desk::before { left: 15px; }
#desk::after { right: 15px; }

/* 책 */
#book {
    position: absolute;
    left: 90px;
    bottom: 27%;
    width: 80px;
    height: 55px;
    background: #6c2525;
    border: 3px solid #321010;
    transform: rotate(-5deg);
    cursor: pointer;
}

/* 액자 */
#picture {
    position: absolute;
    right: 12%;
    top: 15%;
    width: 170px;
    height: 130px;
    background: #302414;
    border: 12px solid #765b35;
    cursor: pointer;
}

#picture::after {
    content: "7  △  3";
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    background: #161616;
    color: #d7c28b;
    font-size: 25px;
}

/* 시계 */
#clock {
    position: absolute;
    left: 12%;
    top: 13%;
    width: 110px;
    height: 110px;
    border: 7px solid #777;
    border-radius: 50%;
    background: #111;
    cursor: pointer;
}

#clock::before {
    content: "";
    position: absolute;
    width: 4px;
    height: 38px;
    background: white;
    left: 50%;
    top: 17px;
    transform-origin: bottom;
    transform: rotate(30deg);
}

#clock::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 30px;
    background: white;
    left: 50%;
    top: 25px;
    transform-origin: bottom;
    transform: rotate(300deg);
}

/* 메모 */
#note {
    position: absolute;
    right: 5%;
    bottom: 12%;
    width: 180px;
    min-height: 100px;
    padding: 15px;
    background: #c8b77a;
    color: #181818;
    transform: rotate(3deg);
    cursor: pointer;
    box-shadow: 5px 8px 15px #000;
}

#note b {
    display: block;
    margin-bottom: 8px;
}

/* HUD */
#hud {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 12px 18px;
    background: rgba(0,0,0,.65);
    border: 1px solid #555;
    border-radius: 8px;
    z-index: 10;
}

#message {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: min(700px,90%);
    padding: 15px;
    text-align: center;
    background: rgba(0,0,0,.8);
    border: 1px solid #555;
    border-radius: 8px;
    z-index: 20;
}

/* 팝업 */
#popup {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 50;
    align-items: center;
    justify-content: center;
}

.panel {
    width: min(450px,90%);
    background: #181818;
    border: 2px solid #666;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 0 50px black;
}

input {
    width: 100%;
    padding: 14px;
    margin: 15px 0;
    background: #090909;
    border: 1px solid #555;
    color: white;
    text-align: center;
    font-size: 22px;
    letter-spacing: 5px;
}

button {
    padding: 12px 25px;
    border: none;
    border-radius: 7px;
    background: #777;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #999;
}

/* 탈출 성공 */
#win {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,.95);
    align-items: center;
    justify-content: center;
    text-align: center;
}

#win h1 {
    font-size: 60px;
    color: #eee;
    text-shadow: 0 0 30px white;
}

#win p {
    font-size: 20px;
    color: #aaa;
}

.flash {
    animation: flash .2s 3;
}

@keyframes flash {
    50% {
        filter: brightness(3);
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="wall"></div>
    <div class="floor"></div>

    <div id="lamp"></div>

    <div id="door" title="잠긴 문">
        <div id="lock"></div>
        <div id="handle"></div>
    </div>

    <div id="desk"></div>
    <div id="book" title="책"></div>

    <div id="picture" title="액자"></div>
    <div id="clock" title="시계"></div>

    <div id="note">
        <b>낡은 메모</b>
        "시계가 가리키는 시간과<br>
        그림 속 숫자를 기억하라."
    </div>

    <div id="darkness"></div>

    <div id="hud">
        🔐 방 탈출<br>
        <span id="status">단서를 찾아보세요.</span>
    </div>

    <div id="message">
        주변의 물건을 클릭해서 단서를 찾아보세요.
    </div>

    <!-- 암호 입력 -->
    <div id="popup">
        <div class="panel">
            <h2>🔒 문이 잠겨 있다</h2>
            <p>4자리 암호를 입력하세요.</p>

            <input
                id="code"
                maxlength="4"
                inputmode="numeric"
                placeholder="0000"
            >

            <br>

            <button onclick="checkCode()">확인</button>
            <button onclick="closePopup()">닫기</button>

            <p id="error"></p>
        </div>
    </div>

    <!-- 성공 -->
    <div id="win">
        <div>
            <h1>🎉 탈출 성공!</h1>
            <p>축하합니다.</p>
            <p>모든 단서를 찾아 방에서 탈출했습니다.</p>
            <button onclick="location.reload()">다시 플레이</button>
        </div>
    </div>

</div>

<script>

let found = {
    book: false,
    picture: false,
    clock: false,
    note: false
};

const message = document.getElementById("message");
const status = document.getElementById("status");

function updateStatus() {

    let count = Object.values(found).filter(Boolean).length;

    status.textContent =
        "단서 발견: " + count + " / 4";

    if (count === 4) {
        message.textContent =
            "모든 단서를 확인했습니다. 문을 클릭해서 암호를 입력하세요!";
    }
}

/* 책 */
document.getElementById("book").onclick = function() {

    found.book = true;

    message.textContent =
        "책에서 숫자를 발견했다. → 2";

    this.style.boxShadow =
        "0 0 25px rgba(255,255,255,.5)";

    updateStatus();
};

/* 액자 */
document.getElementById("picture").onclick = function() {

    found.picture = true;

    message.textContent =
        "그림 속 숫자: 7 △ 3";

    updateStatus();
};

/* 시계 */
document.getElementById("clock").onclick = function() {

    found.clock = true;

    message.textContent =
        "시계가 가리키는 시간은 10시 20분이다. → 1020";

    updateStatus();
};

/* 메모 */
document.getElementById("note").onclick = function() {

    found.note = true;

    message.textContent =
        "메모: '시계가 가리키는 시간과 그림 속 숫자를 기억하라.'";

    updateStatus();
};

/* 문 */
document.getElementById("door").onclick = function() {

    if (!Object.values(found).every(Boolean)) {

        message.textContent =
            "아직 모든 단서를 찾지 못했습니다.";

        document.getElementById("game")
            .classList.add("flash");

        setTimeout(() => {
            document.getElementById("game")
                .classList.remove("flash");
        }, 700);

        return;
    }

    document.getElementById("popup").style.display = "flex";
    document.getElementById("code").focus();
};

/* 암호 */
function checkCode() {

    const input =
        document.getElementById("code").value;

    /*
        정답:
        1020
    */

    if (input === "1020") {

        document.getElementById("popup").style.display = "none";

        document.getElementById("win").style.display = "flex";

    } else {

        document.getElementById("error").textContent =
            "❌ 암호가 틀렸습니다.";

        document.getElementById("error").style.color =
            "#ff5555";
    }
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

/* Enter 키 */
document.getElementById("code").addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        checkCode();
    }

});

updateStatus();

</script>

</body>
</html>
```
