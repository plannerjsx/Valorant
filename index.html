<body>

<div id="flashlight"></div>

<div id="message"></div>

        <p>
            새벽 2시.<br>

            하지만 문을 닫는 순간<br>
            병원 안쪽에서 발소리가 들렸다.

<div id="touch">

        <button class="touchBtn" data-key="s">▼</button>
        <button class="touchBtn" data-key="d">▶</button>
    </div>

</div>

<script>

/* =========================================================
   기본 설정
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
}

addEventListener("resize",resize);
resize();


/* =========================================================
   게임 상태
========================================================= */

let running = false;
let gameWon = false;
let gameLost = false;

let health = 100;
let keysFound = 0;
let battery = 100;

let messageTimer = 0;

const keys = {};

let mouseX = W/2;
let mouseY = H/2;

let cameraX = 0;
let cameraY = 0;


/* =========================================================
   플레이어
========================================================= */

const player = {
    x:180,
    y:180,
    r:14,
    speed:2.4
};


/* =========================================================
   월드
========================================================= */

const WORLD_W = 3000;
const WORLD_H = 2200;


/* =========================================================
   벽
========================================================= */

const walls = [

    // 외벽
    {x:0,y:0,w:WORLD_W,h:40},
    {x:0,y:WORLD_H-40,w:WORLD_W,h:40},
    {x:0,y:0,w:40,h:WORLD_H},
    {x:WORLD_W-40,y:0,w:40,h:WORLD_H},

    // 병실
    {x:500,y:100,w:40,h:700},
    {x:500,y:800,w:800,h:40},

    // 중앙 복도
    {x:1300,y:100,w:40,h:850},
    {x:1700,y:500,w:40,h:1000},

    // 아래쪽 방
    {x:400,y:1300,w:900,h:40},
    {x:400,y:1300,w:40,h:600},
    {x:1300,y:1500,w:400,h:40},

    // 오른쪽
    {x:2100,y:100,w:40,h:700},
    {x:2100,y:800,w:650,h:40},

    {x:2300,y:1200,w:40,h:700},
    {x:1900,y:1800,w:440,h:40},

    // 작은 방
    {x:700,y:400,w:300,h:40},
    {x:1000,y:400,w:40,h:300},

    {x:700,y:1000,w:40,h:300},
    {x:700,y:1000,w:400,h:40},

    // 장애물
    {x:1450,y:300,w:150,h:40},
    {x:1450,y:300,w:40,h:220},

    {x:900,y:1550,w:250,h:40},
    {x:1150,y:1550,w:40,h:180},

    {x:1850,y:1000,w:350,h:40},
    {x:1850,y:1000,w:40,h:250}
];


/* =========================================================
   아이템
========================================================= */

const itemObjects = [

    {
        x:350,
        y:600,
        type:"key",
        collected:false
    },

    {
        x:900,
        y:1150,
        type:"key",
        collected:false
    },

    {
        x:2450,
        y:1500,
        type:"key",
        collected:false
    }
];


/* =========================================================
   탈출구
========================================================= */

const exit = {
    x:2800,
    y:1950,
    w:80,
    h:120
};


/* =========================================================
   괴물
========================================================= */

const monster = {

    x:2600,
    y:400,

    r:22,

    speed:1.0,

    active:false,

    targetTimer:0,

    wanderX:2600,
    wanderY:400
};


/* =========================================================
   충돌
========================================================= */

function circleRectCollision(cx,cy,r,rect){

    const closestX =
        Math.max(rect.x,Math.min(cx,rect.x+rect.w));

    const closestY =
        Math.max(rect.y,Math.min(cy,rect.y+rect.h));

    const dx = cx-closestX;
    const dy = cy-closestY;

    return dx*dx+dy*dy < r*r;
}


function collidesWall(x,y,r){

    for(const wall of walls){

        if(circleRectCollision(x,y,r,wall))
            return true;

    }

    return false;
}


function movePlayer(dx,dy){

    let nx = player.x + dx;

    if(!collidesWall(nx,player.y,player.r))
        player.x = nx;

    let ny = player.y + dy;

    if(!collidesWall(player.x,ny,player.r))
        player.y = ny;
}


/* =========================================================
   키보드
========================================================= */

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;

    if(e.key === "Shift")
        keys.shift = true;

});

addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;

    if(e.key === "Shift")
        keys.shift = false;

});


/* =========================================================
   마우스
========================================================= */

addEventListener("mousemove",e=>{

    mouseX = e.clientX;
    mouseY = e.clientY;

});


/* =========================================================
   터치
========================================================= */

document.querySelectorAll(".touchBtn").forEach(btn=>{

    const key = btn.dataset.key;

    btn.addEventListener("touchstart",e=>{
        e.preventDefault();
        keys[key]=true;
    });

    btn.addEventListener("touchend",e=>{
        e.preventDefault();
        keys[key]=false;
    });

});


/* =========================================================
   사운드
========================================================= */

let audioCtx = null;

function initAudio(){

    if(!audioCtx)
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

}


function sound(freq,duration,type="sine",volume=.04){

    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.value = volume;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    osc.stop(audioCtx.currentTime+duration);
}


function heartbeat(){

    sound(70,.12,"sine",.06);

    setTimeout(()=>{
        sound(55,.1,"sine",.05);
    },150);

}


/* =========================================================
   메시지
========================================================= */

function showMessage(text,time=180){

    document.getElementById("message").textContent=text;

    messageTimer=time;

}


/* =========================================================
   플레이어 업데이트
========================================================= */

function updatePlayer(){

    let dx=0;
    let dy=0;

    if(keys.w || keys.arrowup) dy--;
    if(keys.s || keys.arrowdown) dy++;
    if(keys.a || keys.arrowleft) dx--;
    if(keys.d || keys.arrowright) dx++;

    if(dx!==0 || dy!==0){

        const length=Math.hypot(dx,dy);

        dx/=length;
        dy/=length;

        let speed=player.speed;

        if(keys.shift){
            speed=4.1;
            battery-=0.015;
        }

        movePlayer(dx*speed,dy*speed);

    }

}


/* =========================================================
   아이템
========================================================= */

function updateItems(){

    for(const item of itemObjects){

        if(item.collected) continue;

        const dist=Math.hypot(
            player.x-item.x,
            player.y-item.y
        );

        if(dist<35){

            item.collected=true;

            keysFound++;

            sound(800,.15,"square",.04);

            if(keysFound===3){

                showMessage(
                    "열쇠 3개를 모두 찾았다. 출구로 가라.",
                    300
                );

            }else{

                showMessage(
                    `열쇠를 찾았다! (${keysFound}/3)`,
                    180
                );

            }

        }

    }

}


/* =========================================================
   괴물 AI
========================================================= */

function updateMonster(){

    const dist=Math.hypot(
        player.x-monster.x,
        player.y-monster.y
    );


    /*
        일정 거리 안으로 들어오면 추격 시작
    */

    if(dist<650)
        monster.active=true;


    if(monster.active){

        let dx=player.x-monster.x;
        let dy=player.y-monster.y;

        const len=Math.hypot(dx,dy);

        if(len>0){

            dx/=len;
            dy/=len;

        }


        let speed=monster.speed;

        /*
            플레이어가 가까워질수록 조금 빨라짐
        */

        if(dist<350)
            speed=1.45;

        if(dist<200)
            speed=1.8;


        const nx=monster.x+dx*speed;
        const ny=monster.y+dy*speed;


        if(!collidesWall(nx,monster.y,monster.r))
            monster.x=nx;

        if(!collidesWall(monster.x,ny,monster.r))
            monster.y=ny;


        /*
            가까워졌을 때 피해
        */

        if(dist<48){

            health-=0.12;

            if(Math.random()<0.015)
                heartbeat();

        }

    }else{

        /*
            아직 발견하지 못했을 때 천천히 배회
        */

        monster.targetTimer--;

        if(monster.targetTimer<=0){

            monster.targetTimer=120;

            monster.wanderX=
                100+Math.random()*(WORLD_W-200);

            monster.wanderY=
                100+Math.random()*(WORLD_H-200);

        }


        let dx=monster.wanderX-monster.x;
        let dy=monster.wanderY-monster.y;

        const len=Math.hypot(dx,dy);

        if(len>5){

            dx/=len;
            dy/=len;

            const nx=monster.x+dx*.45;
            const ny=monster.y+dy*.45;

            if(!collidesWall(nx,monster.y,monster.r))
                monster.x=nx;

            if(!collidesWall(monster.x,ny,monster.r))
                monster.y=ny;

        }

    }


    /*
        괴물이 너무 가까우면 공포 효과
    */

    const dangerDistance=Math.hypot(
        player.x-monster.x,
        player.y-monster.y
    );

    const danger=document.getElementById("danger");

    if(dangerDistance<500){

        const opacity=
            Math.max(
                0,
                1-dangerDistance/500
            )*.65;

        danger.style.opacity=opacity;

    }else{

        danger.style.opacity=0;

    }


    if(health<=0){

        gameLost=true;

        running=false;

        document.getElementById("gameOver")
            .classList.remove("hidden");

    }

}


/* =========================================================
   탈출구
========================================================= */

function updateExit(){

    const dist=Math.hypot(
        player.x-(exit.x+exit.w/2),
        player.y-(exit.y+exit.h/2)
    );


    if(dist<100){

        if(keysFound>=3){

            gameWon=true;
            running=false;

            sound(900,.5,"sine",.07);

            document.getElementById("winScreen")
                .classList.remove("hidden");

        }else{

            showMessage(
                `문이 잠겨 있다. 열쇠가 ${3-keysFound}개 더 필요하다.`,
                100
            );

        }

    }

}


/* =========================================================
   카메라
========================================================= */

function updateCamera(){

    cameraX =
        player.x-W/2;

    cameraY =
        player.y-H/2;


    cameraX=Math.max(
        0,
        Math.min(cameraX,WORLD_W-W)
    );

    cameraY=Math.max(
        0,
        Math.min(cameraY,WORLD_H-H)
    );

}


/* =========================================================
   렌더링
========================================================= */

function drawWorld(){

    ctx.fillStyle="#070707";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
        바닥
    */

    ctx.save();

    ctx.translate(-cameraX,-cameraY);

    ctx.fillStyle="#151515";

    ctx.fillRect(
        0,
        0,
        WORLD_W,
        WORLD_H
    );


    /*
        바닥 타일
    */

    ctx.strokeStyle="rgba(255,255,255,.025)";
    ctx.lineWidth=1;

    for(let x=40;x<WORLD_W;x+=80){

        ctx.beginPath();
        ctx.moveTo(x,40);
        ctx.lineTo(x,WORLD_H-40);
        ctx.stroke();

    }

    for(let y=40;y<WORLD_H;y+=80){

        ctx.beginPath();
        ctx.moveTo(40,y);
        ctx.lineTo(WORLD_W-40,y);
        ctx.stroke();

    }


    /*
        벽
    */

    for(const wall of walls){

        ctx.fillStyle="#292929";

        ctx.fillRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

        ctx.strokeStyle="#444";

        ctx.strokeRect(
            wall.x,
            wall.y,
            wall.w,
            wall.h
        );

    }


    /*
        출구
    */

    ctx.fillStyle =
        keysFound>=3
        ? "#245f32"
        : "#3b1717";

    ctx.fillRect(
        exit.x,
        exit.y,
        exit.w,
        exit.h
    );

    ctx.strokeStyle="#aaa";

    ctx.strokeRect(
        exit.x,
        exit.y,
        exit.w,
        exit.h
    );

    ctx.fillStyle="#ddd";

    ctx.font="16px Arial";

    ctx.fillText(
        "EXIT",
        exit.x+17,
        exit.y+60
    );


    /*
        열쇠
    */

    for(const item of itemObjects){

        if(item.collected)
            continue;

        ctx.save();

        ctx.translate(item.x,item.y);

        ctx.rotate(Math.PI/4);

        ctx.fillStyle="#d8b83d";

        ctx.fillRect(
            -7,
            -7,
            14,
            14
        );

        ctx.restore();

        ctx.strokeStyle="#fff2a0";

        ctx.beginPath();

        ctx.arc(
            item.x,
            item.y,
            10,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    /*
        괴물
    */

    ctx.save();

    ctx.translate(monster.x,monster.y);

    /*
        그림자
    */

    ctx.fillStyle="rgba(0,0,0,.6)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        20,
        35,
        12,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        몸
    */

    ctx.fillStyle="#080808";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        monster.r,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
        눈
    */

    ctx.fillStyle="#eee";

    ctx.beginPath();

    ctx.arc(-7,-5,3,0,Math.PI*2);
    ctx.arc(7,-5,3,0,Math.PI*2);

    ctx.fill();

    ctx.restore();


    /*
        플레이어
    */

    ctx.fillStyle="#ddd";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.r,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle="#fff";

    ctx.stroke();


    /*
        손전등 방향 표시
    */

    const worldMouseX=
        mouseX+cameraX;

    const worldMouseY=
        mouseY+cameraY;

    const angle=
        Math.atan2(
            worldMouseY-player.y,
            worldMouseX-player.x
        );

    ctx.strokeStyle=
        "rgba(255,255,255,.3)";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y
    );

    ctx.lineTo(
        player.x+Math.cos(angle)*55,
        player.y+Math.sin(angle)*55
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   손전등
========================================================= */

function updateFlashlight(){

    /*
        화면 중앙을 기준으로 마우스 방향을 약간 반영
    */

    const dx=mouseX-W/2;
    const dy=mouseY-H/2;

    const distance=Math.hypot(dx,dy);

    const offsetX =
        distance>0
        ? dx/distance*80
        : 0;

    const offsetY =
        distance>0
        ? dy/distance*80
        : 0;


    const size =
        150 + Math.min(battery,100)*.5;


    document.getElementById("flashlight")
        .style.background=
        `radial-gradient(
            circle ${size}px at
            ${50+offsetX/W*100}%
            ${50+offsetY/H*100}%,
            transparent 0%,
            rgba(0,0,0,.08) 30%,
            rgba(0,0,0,.7) 65%,
            rgba(0,0,0,.97) 100%
        )`;


    /*
        손전등 배터리
    */

    battery-=0.003;

    if(battery<0)
        battery=0;


    document.getElementById("battery")
        .textContent=Math.floor(battery);

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById("keyCount")
        .textContent=keysFound;

    document.getElementById("healthBar")
        .style.width=Math.max(0,health)+"%";


    if(messageTimer>0){

        messageTimer--;

        if(messageTimer<=0)
            document.getElementById("message").textContent="";

    }

}


/* =========================================================
   메인 업데이트
========================================================= */

function update(){

    if(!running)
        return;

    updatePlayer();

    updateItems();

    updateMonster();

    updateExit();

    updateCamera();

    updateFlashlight();

    updateHUD();

}


/* =========================================================
   메인 렌더
========================================================= */

function draw(){

    drawWorld();

}


/* =========================================================
   게임 루프
========================================================= */

function loop(){

    update();

    draw();

    requestAnimationFrame(loop);

}

loop();
